<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Por que você é especial ♡</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Georgia, serif;
            text-align: center;
            padding: 50px 20px;
        }

        .caixa {
            max-width: 700px;
            margin: auto;
            background: #f2f2f2;
            color: #222;
            padding: 40px;
            border-radius: 25px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitulo {
            margin-bottom: 35px;
        }

        .cartoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 25px 10px;
            border: none;
            border-radius: 15px;
            background: #222;
            color: white;
            font-family: Georgia, serif;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        a {
            display: block;
            margin-top: 30px;
            color: #222;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="caixa">

        <h1>Por que você é especial? ♡</h1>

        <p class="subtitulo">
            Clique nos quadradinhos...
        </p>

        <div class="cartoes">

            <button onclick="alert('porque vc é meu conforto ❤️')">
                vc é meu lar
            </button>

            <button onclick="alert('porque voce me tras segurança ❤️')">
                eu amo vc
            </button>

            <button onclick="alert('vc me tras felicidade. ❤️')">
                vc é td pra mim
            </button>

            <button onclick="alert('voce é autista  ne safadinho, combina cmg. ❤️')">
                Você
            </button>

        </div>

        <a href="declaracao.html">← voltar para a declaração</a>

    </div>

</body>
</html>
